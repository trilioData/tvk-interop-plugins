[pytest]
addopts = -v -s --html=report.html --self-contained-html
testpaths = tests
log_cli = true
log_cli_level = INFO
markers =
    login: Trilio UI login
    app: demo application install/verify
    helm_app: install the mysql-qa helm chart (for helm transformation)
    target: backup target creation
    target_browsing: create a target with Enable Browsing on (no app install)
    policy: retention policy creation
    backupplan: backup plan creation
    backup: trigger backup and wait for completion
    backup_status: confirm a backup is in Available state (UI)
    snapshot: snapshot stage verification
    restore: restore from backup (optional transformation)
    restore_status: confirm a restore completed (UI)
    helm_transform: self-contained helm transformation (ns+app+backup+restore)
    custom_transform: self-contained custom transformation (ns-backup + PVC storageClass retarget)
    cassandra: standalone cassandra operator + namespace plan + backup
    cassandra_app: install cass-operator, CassandraDatacenter, seed/verify data
    cassandra_backupplan: UI Single-namespace backup plan for cass-oper-ns
    cassandra_application_backupplan: UI Application plan (operator + CassandraDatacenter)
    cassandra_backup: trigger backup from the cassandra plan and wait
    cleanup: delete test namespaces
    # --- feature integration suite (CR driven, tests/test_feature_integration.py) ---
    feat_apps: install customer apps and seed marker data
    feat_policy: create shared Schedule and Retention policies
    feat_backupplan: create Helm / label / namespace backup plans
    feat_schedule: verify a Schedule Policy registers CronJobs and is reusable
    feat_backup: trigger backups and assert they captured real data
    feat_restore: restore each backup type and verify data integrity
    feat_transform: transformation restore, verifying the patches actually applied
    feat_scheduled: prove a scheduled backup fires on its own
    feat_retention: retention pruning and pauseSchedule
    feat_policy_lifecycle: known shared-policy defects (xfail until fixed)
    feat_cleanup: tear down feature-suite namespaces and CRs
